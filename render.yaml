services:
  - type: web
    name: restaurant-gourmet-app
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FEATURE_ONLINE_ORDERING
        value: "true"
      - key: FEATURE_TABLE_RESERVATION
        value: "true"
      - key: FEATURE_PROMOTIONS_BANNER
        value: "true"
